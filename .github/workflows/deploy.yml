name: Deploy to EKS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Configure AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Step 3: Login to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Step 4: Build Docker Image
    - name: Build Docker Image
      env:
        REGISTRY: ${{ secrets.ECR_REGISTRY }}
        REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        if [ -z "$REGISTRY" ] || [ -z "$REPOSITORY" ]; then
          echo "ERROR: ECR_REGISTRY or ECR_REPOSITORY secrets are not set"
          exit 1
        fi
        docker build -t "${REGISTRY}/${REPOSITORY}:latest" .
        docker build -t "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" .

    # Step 5: Push to ECR
    - name: Push Docker Image to ECR
      env:
        REGISTRY: ${{ secrets.ECR_REGISTRY }}
        REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push "${REGISTRY}/${REPOSITORY}:latest"
        docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

    # Step 6: Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    # Step 7: Connect to EKS
    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig \
          --name pdf-chatbot-cluster \
          --region ${{ secrets.AWS_REGION }}

    # Step 8: Create Kubernetes Secrets
    - name: Create Kubernetes Secrets
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }} \
          --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dry-run=client -o yaml | kubectl apply -f -

    # Step 9: Deploy to Kubernetes
    - name: Deploy to Kubernetes
      env:
        REGISTRY: ${{ secrets.ECR_REGISTRY }}
        REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/pdf-chatbot \
          pdf-chatbot="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

    # Step 10: Wait for Deployment
    - name: Wait for Deployment Rollout
      run: |
        kubectl rollout status deployment/pdf-chatbot --timeout=300s

    # Step 11: Show Live URL
    - name: Get Live Service URL
      run: |
        echo "========================================="
        echo "   PDF Chatbot Deployment Complete! 🚀   "
        echo "========================================="
        kubectl get services pdf-chatbot-service
        echo "========================================="